trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# ---------------- BUILD AND TEST ----------------

- stage: Build_Test
  displayName: 'Build and Run Tests'

  jobs:
  - job: BuildAndTest
    displayName: 'Python Build and Unit Tests'

    steps:

    - checkout: self
      fetchDepth: 0
      displayName: 'Checkout Source Code'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        addToPath: true
      displayName: 'Setup Python 3.11'

    - script: |
        python -m pip install --upgrade pip
      displayName: 'Upgrade pip'

    - script: |
        pip install -r House-price-prediction-using-flask-main/requirement.txt
      displayName: 'Install Dependencies'

    - script: |
        pip install pytest pytest-html pytest-cov
      displayName: 'Install Unit Test Dependencies'

    - script: |
        python -m py_compile House-price-prediction-using-flask-main/app.py
        python -m py_compile House-price-prediction-using-flask-main/house.py
      displayName: 'Validate Python Code'

    - script: |
        mkdir -p test-results
      displayName: 'Create Test Result Folder'

    - script: |
        cd House-price-prediction-using-flask-main
        pytest -v \
          --junitxml=../test-results/junit.xml \
          --html=../test-results/unit-test-report.html \
          --self-contained-html \
          --cov=. \
          --cov-report=xml:../test-results/coverage.xml \
          --cov-report=term
      displayName: 'Run Unit Tests'
      continueOnError: true

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/junit.xml'
        testRunTitle: 'House Price Prediction Unit Tests'
        failTaskOnFailedTests: false
      displayName: 'Publish Unit Test Results'

    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: 'test-results'
        artifact: 'test-results'
        publishLocation: 'pipeline'
      displayName: 'Publish Test Results Artifact'


# ---------------- SONARCLOUD ANALYSIS ----------------

- stage: SonarQube
  displayName: 'SonarCloud Code Quality Analysis'

  dependsOn: Build_Test
  condition: succeededOrFailed()

  jobs:
  - job: SonarQubeAnalysis
    displayName: 'SonarCloud Analysis'

    steps:

    - checkout: self
      fetchDepth: 0
      displayName: 'Checkout Source Code'

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'test-results'
        path: '$(Pipeline.Workspace)/test-results'
      displayName: 'Download Test Results and Coverage'

    - task: SonarCloudPrepare@4
      inputs:
        SonarCloud: 'SonarQube-House-Project'
        organization: 'maheshpasapala'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'House-price-prediction-using-flask'
        cliProjectName: 'House Price Prediction'
        cliSources: 'House-price-prediction-using-flask-main'
        extraProperties: |
          sonar.exclusions=**/tests/**,**/__pycache__/**,**/.pytest_cache/**
          sonar.python.version=3.11
          sonar.python.coverage.reportPaths=$(Pipeline.Workspace)/test-results/coverage.xml
      displayName: 'Prepare SonarCloud Analysis'

    - task: SonarCloudAnalyze@4
      inputs:
        jdkversion: 'JAVA_HOME_17_X64'
      displayName: 'Run SonarCloud Analysis'

    - task: SonarCloudPublish@4
      inputs:
        pollingTimeoutSec: '300'
      displayName: 'Publish SonarCloud Quality Gate'


# ---------------- RUN FLASK APPLICATION ----------------

- stage: Run_Application
  displayName: 'Run Flask Application'

  dependsOn: SonarQube
  condition: succeeded()

  jobs:
  - job: StartFlask
    displayName: 'Start Flask Application'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        addToPath: true
      displayName: 'Setup Python 3.11'

    - script: |
        pip install -r House-price-prediction-using-flask-main/requirement.txt
      displayName: 'Install Dependencies'

    - script: |
        cd House-price-prediction-using-flask-main
        python app.py &
        sleep 10
        echo "Flask application started successfully"
      displayName: 'Start Flask Application'